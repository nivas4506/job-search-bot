name: Scheduled Alerts

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare runtime directories
        run: |
          mkdir -p data outputs

      - name: Restore dedupe cache
        uses: actions/cache/restore@v5
        with:
          path: data/
          key: seen-items-${{ github.run_id }}
          restore-keys: |
            seen-items-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve runtime configuration
        env:
          SECRETS_JSON: "${{ toJSON(secrets) }}"
          VARS_JSON: "${{ toJSON(vars) }}"
        run: |
          python - <<'PY'
          import json
          import os

          required = [
              "EMAIL_ENABLED",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_USE_TLS",
              "ALERT_FROM_EMAIL",
              "ALERT_TO_EMAIL",
              "MAX_RESULTS_PER_QUERY",
          ]
          optional = [
              "UPSTASH_REDIS_REST_URL",
              "UPSTASH_REDIS_REST_TOKEN",
          ]

          secrets = json.loads(os.getenv("SECRETS_JSON", "{}") or "{}")
          variables = json.loads(os.getenv("VARS_JSON", "{}") or "{}")

          target = os.environ["GITHUB_ENV"]
          with open(target, "a", encoding="utf-8") as f:
              for key in required + optional:
                  value = str(secrets.get(key) or variables.get(key) or "").strip()
                  if value:
                      f.write(f"{key}={value}\n")
          PY

      - name: Validate required configuration
        run: |
          python - <<'PY'
          import os
          required = [
              "EMAIL_ENABLED",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_USE_TLS",
              "ALERT_FROM_EMAIL",
              "ALERT_TO_EMAIL",
              "MAX_RESULTS_PER_QUERY",
          ]
          missing = [key for key in required if not os.getenv(key, "").strip()]
          if missing:
              raise SystemExit(f"Missing GitHub Actions secrets or variables: {', '.join(missing)}")
          PY

      - name: Run jobs alerts
        run: python src/run_jobs_alerts.py

      - name: Run hackathon alerts
        run: python src/run_hackathon_alerts.py

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alert-reports-${{ github.run_id }}
          path: outputs/*.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Save dedupe cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/
          key: seen-items-${{ github.run_id }}
