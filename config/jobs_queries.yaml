search_engine: google_html
recent_days: 120
direct_job_links: true
direct_apply_only: true
india_only: true
queries:
  - name: Microsoft Intern (India)
    query: Microsoft ("software engineer intern" OR "sde intern" OR internship) India careers
    include_keywords: [intern, internship, software, engineer, student, fresher]
    allowed_domains: [careers.microsoft.com, jobs.careers.microsoft.com]
    required_url_keywords: [intern, universityinternship, exploremicrosoft, job, apply]
    exclude_keywords: [senior, staff, manager, principal, lead, architect, experienced]

  - name: Google Intern (India)
    query: Google ("software engineer intern" OR "software intern" OR internship) India careers
    include_keywords: [intern, internship, software, engineer, student, fresher]
    allowed_domains: [careers.google.com]
    required_url_keywords: [intern, jobs, apply, position, search]
    exclude_keywords: [senior, staff, manager, principal, lead, architect, experienced]

  - name: Amazon Intern (India)
    query: Amazon ("software development engineer intern" OR "sde intern" OR internship OR "student program") India jobs
    include_keywords: [intern, internship, software, engineer, student, fresher]
    allowed_domains: [amazon.jobs]
    required_url_keywords: [intern, jobs, apply, jobid]
    exclude_keywords: [senior, staff, manager, principal, lead, architect, experienced]

